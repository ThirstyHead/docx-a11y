name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Smoke CLI
        run: |
          docx-a11y rules
          docx-a11y audit tests/fixtures/clean.docx || true
          docx-a11y audit tests/fixtures/violations.docx --json /tmp/v.json || true
          docx-a11y fix tests/fixtures/fixable.docx --out /tmp/f.docx \
            --heading-map '0=Heading 1,3=Heading 2,4=Heading 2'
          test -f /tmp/f.docx
          docx-a11y audit tests/fixtures/fixable.docx --batch tests/fixtures || true
