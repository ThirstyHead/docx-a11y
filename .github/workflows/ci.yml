name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
      - name: Smoke CLI
        run: |
          mkdir -p /tmp/smoke
          docx-a11y tests/fixtures/clean.docx --format md,html,pdf,json --output-dir /tmp/smoke
          test -f /tmp/smoke/clean-a11y-report.md
          test -f /tmp/smoke/clean-a11y-report.html
          test -f /tmp/smoke/clean-a11y-report.pdf
          test -f /tmp/smoke/clean-audit.json
          docx-a11y tests/fixtures/fixable.docx --fix --out-docx /tmp/smoke/f.docx --format md,html,pdf,json --output-dir /tmp/smoke || true
          test -f /tmp/smoke/f.docx
          test -f /tmp/smoke/fixable-a11y-report.pdf
