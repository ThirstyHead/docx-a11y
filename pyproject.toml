[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-a11y"
version = "0.1.0"
description = "Audit and remediate Word .docx files against WCAG 2.1 AA (standalone, no AI required)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "docx-a11y contributors" }]
keywords = ["accessibility", "wcag", "docx", "word", "ooxml", "audit", "remediation"]
dependencies = [
    "python-docx-ng>=2.1,<3",
    "wcag-contrast-ratio>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
docx-a11y = "docx_a11y.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]